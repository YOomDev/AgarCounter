<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Agar Counter | v0.2</title>
        <style>
            .hidden {
                display: none;
                visibility: hidden;
            }
        </style>
    </head>
    <body>
        <div id="content">
            <div class="hidden">
                <h1>Parts used for getting webcam data</h1>
                <device type="media"></device>
                <video autoplay></video>
                <canvas id="mask" width="320" height="240"></canvas>
                <canvas id="debug" width="320" height="240"></canvas>
            </div>
            <div id="loading">
                <h1>Loading everything that's needed</h1>
                <p>Initializing code</p>
                <p>Waiting for webcam input</p>
            </div>
            <div class="hidden" id="main">
                <canvas id="raw" width="320" height="240"></canvas>
                <div class="count">
                    <h1>Count</h1>
                    <input type="checkbox" id="count">
                    <label for="count">Perform count</label>
                    <p id="countValue">0</p>
                </div>
                <h1>Inputs</h1>
                <div class="color">
                    <button type="button" onclick="set_color = AGAR">Set agar mask color</button>
                    <button type="button" onclick="set_color = COLONY">Set Colony mask color</button>
                </div>
                <div class="factor">
                    <h2>Factor</h2>
                    <input type="range" min="0" max="1000" value="300" id="factor">
                    <label for="factor">Magic number</label>
                    <span id="factorValue"></span>
                </div>

            </div>
        </div>
        <script>
            ///////////
            // Ideas //
            ///////////

            // (optional) Make it possible to choose what device to use

            /////////////
            // Inputs: //
            /////////////

            // Factor value
            const factorSlider = {
                input: document.querySelector('#factor'),
                output: document.querySelector('#factorValue')
            }
            function getFactor() {
                let result = factorSlider.input.value / 1000;
                factorSlider.output.innerHTML = `${result}`;
                return result;
            }
            factorSlider.input.oninput = getFactor;

            // Count checkbox
            const countInput = {
                input: document.querySelector('#count'),
                output: document.querySelector('#countValue')
            }

            ////////////////
            // Variables: //
            ////////////////

            // Color enums
            const EMPTY  = 0;
            const AGAR   = 1;
            const COLONY = 2;

            // Color variables
            let set_color = 0; // used for setting the mask colors, identifier for which color to be set
            const MASKS = []; // const arrays can be manipulated but not replaced
            MASKS[EMPTY ] = { r: 0, g: 0, b: 0 };
            MASKS[AGAR  ] = { r: 0, g: 0, b: 0 };
            MASKS[COLONY] = { r: 0, g: 0, b: 0 };
            const FILLS = [];
            FILLS[EMPTY ] = { r: 255, g: 255, b: 255 };
            FILLS[AGAR  ] = { r: 0  , g: 0  , b: 255 };
            FILLS[COLONY] = { r: 0  , g: 0  , b: 0   };

            // Canvas variables
            let set_canvas = 0;
            let max_canvas = 5;
            let canvas_raw  = document.querySelector('#raw');
            let context_raw = canvas_raw.getContext("2d");
            let canvas_mask = document.querySelector('#mask');
            let context_mask = canvas_mask.getContext("2d");
            let canvas_count = document.querySelector('#debug');
            let context_count = canvas_count.getContext("2d");
            const canvasses = [];

            // Counting
            let min_size = 5;
            let factor = getFactor();

            // Device
            const video = document.querySelector('video'); // Video source such as webcam or digital microscope

            ////////////////
            // Functions: //
            ////////////////

            function noDevice() {
                document.querySelector('#content').innerHTML = "<h1>ERROR: Could not load camera source!</h1>";
            }

            function checkDevice() {
                if (!(navigator.mediaDevices.getUserMedia)) { noDevice(); return; }
                navigator.mediaDevices.getUserMedia({ video: true }) // Get video source
                    .then(function (stream) { // If found use source
                        video.srcObject = stream; // Get data stream from camera

                        // Copy camera width and height to the canvasses
                        canvas_raw.width = stream.getVideoTracks()[0].getSettings().width;
                        canvas_raw.height = stream.getVideoTracks()[0].getSettings().height;
                        canvas_mask.width = canvas_raw.width;
                        canvas_mask.height = canvas_raw.height;

                        // Make color picker work
                        canvas_raw.addEventListener('click', e => {
                            let rect = canvas_raw.getBoundingClientRect(); // Get canvas offset
                            setColor(e.clientX - rect.left, e.clientY - rect.top);
                        });

                        // Make sure the required stuff for counting gets set up
                        initCanvas();

                        // Call the count function every set timeframe
                        setInterval(count, 100 /* milliseconds */);

                        // Remove div that shows the webcam is loading
                        document.getElementById("loading").remove();
                        document.getElementById("main").classList.remove("hidden");

                    }).catch(function (e) { noDevice(); console.log(e); }); // If no source: give error
            }

            function initCanvas() {
                context_raw.drawImage(video, 0, 0);
                const raw = context_raw.getImageData(0, 0, canvas_raw.width, canvas_raw.height).data;
                for (let i = 0; i < max_canvas; i++) { canvasses[i] = Uint8ClampedArray.from(raw); }
            }

            function setColor(x = 0, y = 0) {
                if (set_color <= 0) { return; } // Return if no color is set tot be picked
                const raw = context_raw.getImageData(0, 0, canvas_raw.width, canvas_raw.height).data; // Get image data
                const index = ((y * canvas_raw.width) + x) * 4;
                MASKS[set_color] = { r: raw[index], g: raw[index + 1], b: raw[index + 2] }
                console.log(`Color ${set_color} has been set to `, MASKS[set_color]);
                set_color = 0; // Stop color picker from picking multiple times
            }

            function isColor(color, other) { return (color.r === other.r) && (color.g === other.g) && (color.b === other.b); }

            function mask() {
                // Make average image to fix image noise from raw camera input
                let average = Uint8ClampedArray.from(context_raw.getImageData(0, 0, canvas_raw.width, canvas_raw.height).data); // Make sure an array with the correct size exists
                let mask = Uint8ClampedArray.from(context_mask.getImageData(0, 0, canvas_raw.width, canvas_raw.height).data);
                const width = canvas_raw.width;
                let row_index = 0;
                let color_index = 0;
                for (let y = 0; y < canvas_raw.height; y++) {
                    row_index = y * width;
                    for (let x = 0; x < width; x++) {
                        color_index = (row_index + x) * 4; // times 4 cuz of 4 short integer values for each color part from rgba

                        // Get average color
                        let color = { r: 0, g: 0, b: 0 };
                        for (let iterator = 0; iterator < max_canvas; iterator++) {
                            color.r += canvasses[iterator][color_index    ];
                            color.g += canvasses[iterator][color_index + 1];
                            color.b += canvasses[iterator][color_index + 2];
                        }

                        // Set color
                        average[color_index    ] = ~~(color.r / max_canvas); // ~~ = bitwise truncate to 32-bit integer
                        average[color_index + 1] = ~~(color.g / max_canvas);
                        average[color_index + 2] = ~~(color.b / max_canvas);
                    }
                }

                // Store min and max color for masking so we don't have to calculate them on the fly
                factor = getFactor();
                const MIN = [];
                for (let i = 0; i < MASKS.length - 1; i++) { MIN[i] = {
                    r: MASKS[i + 1].r - (factor * MASKS[i + 1].r),
                    g: MASKS[i + 1].g - (factor * MASKS[i + 1].g),
                    b: MASKS[i + 1].b - (factor * MASKS[i + 1].b)
                }; }
                const MAX = [];
                for (let i = 0; i < MASKS.length - 1; i++) { MAX[i] = {
                    r: MASKS[i + 1].r + (factor * MASKS[i + 1].r),
                    g: MASKS[i + 1].g + (factor * MASKS[i + 1].g),
                    b: MASKS[i + 1].b + (factor * MASKS[i + 1].b)
                }; }

                // Perform masking
                for (let y = 0; y < canvas_raw.height; y++) {
                    row_index = y * width;
                    for (let x = 0; x < width; x++) {
                        color_index = (row_index + x) * 4;

                        // Get pixel color
                        let color = { r: average[color_index], g: average[color_index + 1], b: average[color_index + 2] };

                        let mask_result = FILLS[EMPTY];
                        for (let i = 0; i < FILLS.length - 1; i++) {
                            if( color.r < MIN[i].r || color.r > MAX[i].r ||
                                color.g < MIN[i].r || color.r > MAX[i].r ||
                                color.b < MIN[i].b || color.r > MAX[i].r
                            ) { continue; } // If not out of expected range for mask then we check next mask
                            mask_result = FILLS[i + 1]; // Set masked color
                            break;
                        }

                        // Set mask color on output
                        mask[color_index    ] = mask_result.r;
                        mask[color_index + 1] = mask_result.g;
                        mask[color_index + 2] = mask_result.b;
                        mask[color_index + 3] = 255;
                    }
                }
                let mask_image_data = context_mask.createImageData(canvas_mask.width, canvas_mask.height);
                mask_image_data.data.set(mask);
                context_mask.putImageData(mask_image_data, 0, 0);
                canvas_count.width = canvas_mask.width;
                canvas_count.height = canvas_mask.height;
                context_count.putImageData(mask_image_data, 0, 0);
            }

            function count() {
                context_raw.drawImage(video, 0, 0);
                canvasses[set_canvas++] = Uint8ClampedArray.from(context_raw.getImageData(0, 0, canvas_raw.width, canvas_raw.height).data);
                if(set_canvas >= max_canvas) { set_canvas = 0; }
                total = 0;
                if (countInput.input.checked) {
                    mask();

                    // Count the colonies using flood-fill
                    let data = Uint8ClampedArray.from(canvas_count.getImageData(0, 0, canvas_count.width, canvas_count.height).data);
                    for (let x = 0; x < canvas_count.width; x++) {
                        for (let y = 0; y < canvas_count.height; y++) {
                            const color_index = x * y * 4;
                            const pixelColor = { r: data[color_index], g: data[color_index + 1], b: data[color_index + 2] };
                            if (isColor(pixelColor, FILLS[COLONY])) {
                                // TODO: flood-fill
                                total++;
                            }
                        }
                    }
                }
                countInput.output.innerHTML = total;
            }

            // Starts running the script when the entire page has been loaded
            checkDevice();
        </script>
    </body>
</html>
